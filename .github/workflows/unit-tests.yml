name: unit-tests
# Runs the unit suites (no AWS access needed) on Linux. Only for the fork, not part of the upstream pull request.
on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Unit tests
        run: mvn -B -ntp test
      - name: Surefire and ScalaTest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/scalatest-reports
          if-no-files-found: ignore
